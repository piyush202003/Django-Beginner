{% extends 'base.html' %}
{% block title %}
  Wikipedia Search App Project
{% endblock title %}

{% block style %}

<style>
  .result{
    background-color: beige;
    color:cadetblue;
  }
</style>
  
{% endblock style %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <form method="post">
            {% csrf_token %}

            <div class="mb-3">
              <label for="search" class="form-label">Enter Your Text</label>
              <input
                type="text"
                class="form-control"
                name="search"
                id="search"
                placeholder="Enter query"
              >
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Search
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  
  {% if response %}

  <p class="result m-4 p-4">{{ response }}</p>
    
  {% endif %}
    
  

{% endblock content %}
